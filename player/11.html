<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background: linear-gradient(
    90deg,
    red,
    orange,
    yellow,
    lime,
    cyan,
    blue,
    violet
  );"> 

<div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
    <button style="background-color: silver; border: none; padding: 10px; cursor: pointer;">
        <img height="80" width="70" src="../Screenshot_11.png" alt="Screenshot 11">
        <span style="display: inline-block; font-weight: 900; font-size: 40px; color: black; text-shadow: 0 0 0 black; margin-left: 10px;">
            ФИОЛЕТОВЫЙ
        </span>
    </button>
</div>

<nav style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px;">
    <a href="golosovanie.html" style="padding: 10px 20px; color: black; text-decoration: none; background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet
      ); border-radius: 8px;">голосование</a>
    <a href="viborrolei.html" style="padding: 10px 20px; color: black; text-decoration: none; background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet
      ); border-radius: 8px;">выбор ролей</a>
    <a href="../index.html" style="padding: 10px 20px; color: black; text-decoration: none; background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet
      ); border-radius: 8px;">НАЗАД</a>

    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="report" style="padding: 10px 20px; border: none; border-radius: 8px; background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet); color: black; cursor: pointer; font-weight: 700;">REPORT</button>
        <button id="emergency" style="padding: 10px 20px; border: none; border-radius: 8px; background: linear-gradient(90deg, red, orange, yellow, lime, cyan, blue, violet); color: black; cursor: pointer; font-weight: 700;">ЭКСТРЕННОЕ СОБРАНИЕ</button>
    </div>
</nav>

<audio id="notificationAudio" src="../notification-body-found.mp3" preload="auto"></audio>
<audio id="emergencyAudio" src="../siren-in-among-us.mp3" preload="auto"></audio>

<script>
    document.getElementById('report').addEventListener('click', function() {
        var audio = document.getElementById('notificationAudio');
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(function(error) {
                console.warn('Audio playback blocked:', error);
            });
        }
    });

    document.getElementById('emergency').addEventListener('click', function() {
        var audio = document.getElementById('emergencyAudio');
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(function(error) {
                console.warn('Audio playback blocked:', error);
            });
        }
    });
</script>

</body>

</html>
